<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#00A859">
<title>QuickEats Rider</title>

<style>
:root{
  --green:#00A859;
  --green-dark:#008F4C;
  --green-soft:#E8F8F0;
  --bg:#F5F7F6;
  --white:#fff;
  --text:#171A19;
  --muted:#68716D;
  --line:#E1E6E3;
  --red:#EF4444;
  --blue:#1677FF;
  --orange:#F59E0B;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:#e9eeec;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
}

.screen{
  display:none;
  min-height:100vh;
  padding-bottom:82px;
}

.screen.active{
  display:block;
}

/* LOGIN */

#login{
  background:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
}

#login.active{
  display:flex;
}

.login-wrap{
  width:100%;
  max-width:360px;
  text-align:center;
}

.logo{
  width:105px;
  height:105px;
  border-radius:50%;
  background:var(--green);
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  box-shadow:0 12px 30px #00a85935;
}

.logo span{
  font-size:52px;
}

.login-wrap h1{
  font-size:31px;
  font-weight:850;
}

.login-wrap .tag{
  color:var(--muted);
  margin:6px 0 30px;
}

.field{
  text-align:left;
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:750;
  margin-bottom:6px;
}

.field input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 14px;
  background:#fafbfb;
  outline:none;
}

.field input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px #00a85918;
}

.btn{
  width:100%;
  height:53px;
  border-radius:13px;
  border:0;
  font-weight:800;
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-outline{
  background:white;
  border:1px solid #CBD2CF;
  color:var(--text);
  margin-top:10px;
}

.login-help{
  font-size:11px;
  color:var(--muted);
  margin-top:16px;
}

/* TOP BAR */

.top{
  height:70px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:30;
}

.top h2{
  font-size:18px;
}

.top p{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  border:0;
  border-radius:22px;
  background:var(--green-soft);
  color:var(--green);
  padding:9px 13px;
  font-size:12px;
  font-weight:850;
}

.online.off{
  background:#FDECEC;
  color:var(--red);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
}

/* HOME MAP */

.map{
  height:48vh;
  min-height:315px;
  position:relative;
  overflow:hidden;
  background:#e4e9e7;
}

.map::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    linear-gradient(
      25deg,
      transparent 47%,
      #fff 48%,
      #fff 50%,
      transparent 51%
    ),
    linear-gradient(
      110deg,
      transparent 47%,
      #fff 48%,
      #fff 50%,
      transparent 51%
    ),
    linear-gradient(
      0deg,
      transparent 48%,
      #d5ddda 49%,
      #d5ddda 50%,
      transparent 51%
    );

  background-size:125px 90px,150px 125px,85px 85px;
  transform:rotate(3deg);
  opacity:.8;
}

.road{
  position:absolute;
  background:#d2dad7;
  border-radius:50px;
}

.road.r1{
  width:120%;
  height:24px;
  left:-10%;
  top:28%;
  transform:rotate(22deg);
}

.road.r2{
  width:120%;
  height:18px;
  left:-8%;
  top:58%;
  transform:rotate(-28deg);
}

.route{
  position:absolute;
  inset:0;
  z-index:3;
}

.route svg{
  width:100%;
  height:100%;
}

.route path{
  fill:none;
  stroke:#1677FF;
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.marker{
  position:absolute;
  z-index:5;
  width:39px;
  height:39px;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  display:grid;
  place-items:center;
  color:white;
  box-shadow:0 5px 12px #0003;
}

.marker span{
  transform:rotate(45deg);
}

.restaurant{
  background:var(--green);
  left:62%;
  top:18%;
}

.customer{
  background:var(--red);
  right:15%;
  bottom:17%;
}

.rider-dot{
  position:absolute;
  z-index:6;
  left:46%;
  top:49%;
  width:23px;
  height:23px;
  border-radius:50%;
  background:var(--blue);
  border:4px solid white;
  box-shadow:0 2px 10px #0005;
}

.locate{
  position:absolute;
  z-index:8;
  right:15px;
  bottom:18px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 5px 15px #0002;
  font-size:20px;
}

.map-label{
  position:absolute;
  z-index:7;
  background:#fff;
  border-radius:10px;
  padding:7px 9px;
  box-shadow:0 3px 10px #0002;
  font-size:11px;
  font-weight:750;
}

.restaurant-label{
  right:9%;
  top:22%;
}

.customer-label{
  right:7%;
  bottom:8%;
}

/* HOME SHEET */

.sheet{
  position:relative;
  margin-top:-22px;
  z-index:10;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:16px;
  min-height:35vh;
  box-shadow:0 -8px 20px #0000000d;
}

.handle{
  width:42px;
  height:4px;
  background:#d7ddda;
  border-radius:4px;
  margin:0 auto 17px;
}

.sheet-title{
  font-size:19px;
  font-weight:850;
}

.sheet-sub{
  font-size:13px;
  color:var(--muted);
  margin:4px 0 15px;
}

.order-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px;
  box-shadow:0 3px 10px #00000007;
}

.food{
  width:74px;
  height:74px;
  object-fit:cover;
  border-radius:12px;
  float:left;
  margin-right:12px;
}

.order-main{
  min-height:74px;
}

.order-main h3{
  font-size:14px;
  padding-top:2px;
}

.order-main p{
  font-size:12px;
  color:var(--muted);
  margin:4px 0;
}

.rating{
  color:#16A34A;
  font-weight:800;
}

.price{
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.clear{
  clear:both;
}

.order-buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.order-buttons button{
  height:48px;
  border-radius:12px;
  font-weight
