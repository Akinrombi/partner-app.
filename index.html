<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#00A859;--bg:#0F172A;--card:#1E293B;--white:#F8FAFC;--gray:#94A3B8;--border:#334155;--red:#EF4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--white);padding:12px;display:flex;justify-content:center;min-height:100vh;padding-bottom:90px}
.app{width:100%;max-width:480px}
.banner{display:none;background:var(--red);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;border-radius:8px;margin-bottom:12px}
.header{background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:16px;font-weight:700;color:var(--green)}.sub{font-size:12px;color:var(--gray)}
.box{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:12px}
.box-title{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:10px}
.job{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:6px}
.btn{width:100%;min-height:48px;border-radius:8px;border:none;font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px}
.field input{width:100%;min-height:48px;padding:10px;background:var(--bg);border:1px solid var(--border);color:var(--white);border-radius:8px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:10}
.nav button{flex:1;min-height:56px;background:transparent;border:none;color:var(--gray);font-size:12px;font-weight:700;cursor:pointer}
.nav button.active{color:var(--green)}
.empty{color:var(--gray);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="app">

<div id="authScreen" class="box">
  <div class="box-title">Rider Portal Sign In</div>
  <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="rider@test.com"></div>
  <div class="field"><label>Password</label><input type="password" id="authPass"></div>
  <button class="btn" onclick="handleAuth()">LOGIN AS RIDER</button>
</div>

<div id="main" style="display:none">
  <div id="banner" class="banner">⚠️ Connection lost. Reconnecting...</div>
  <div class="header">
    <div><div class="title" id="riderName">Rider Portal</div><div class="sub" id="wallet">Wallet: ₦0</div></div>
    <button class="btn" style="width:auto;min-height:40px;padding:0 14px;font-size:11px" onclick="handleSignOut()">LOGOUT</button>
  </div>

  <div id="tab-offers">
    <div class="box"><div class="box-title">Available Jobs Nearby</div><div id="jobs"></div></div>
  </div>
  <div id="tab-trip" style="display:none">
    <div class="box" id="trip"><p class="empty">No active trip.</p></div>
  </div>

  <div class="nav">
    <button id="nav-offers" class="active" onclick="switchTab('offers')">🛵 Jobs</button>
    <button id="nav-trip" onclick="switchTab('trip')">📦 Active Trip</button>
  </div>
</div>
</div>

<script>
// PASTE YOUR REAL VALUES HERE (Supabase > Settings > API). Use the anon key ONLY.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let rider = null, started = false, knownJobs = null, audioCtx = null;

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) initRider(session.user);
};

async function handleAuth() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) alert(error.message); else initRider(data.user);
}
async function handleSignOut() { await sb.auth.signOut(); location.reload(); }

async function initRider(user) {
  const { data, error } = await sb.from('riders').select('*, profiles(name)').eq('user_id', user.id).maybeSingle();
  if (error || !data) { alert('No rider account found for this login. Check the role setup.'); await sb.auth.signOut(); return; }
  rider = data;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('riderName').innerText = rider.profiles ? rider.profiles.name : 'Rider';
  refresh();
  if (!started) {
    started = true;
    sb.channel('rider-orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, refresh)
      .subscribe(s => { document.getElementById('banner').style.display = (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') ? 'block' : 'none'; });
    setInterval(refresh, 10000);
  }
}

function refresh() { fetchWallet(); fetchJobs(); fetchTrip(); }

async function fetchWallet() {
  const { data } = await sb.from('wallets').select('available_balance').eq('rider_id', rider.id).maybeSingle();
  if (data) document.getElementById('wallet').innerText = 'Wallet: ₦' + Number(data.available_balance).toLocaleString();
}

async function fetchJobs() {
  const { data, error } = await sb.from('orders')
    .select('*, vendors(store_name, address)')
    .eq('status', 'ready_for_rider').is('rider_id', null)
    .order('created_at', { ascending: true });
  if (error) { document.getElementById('banner').style.display = 'block'; return; }
  document.getElementById('banner').style.display = 'none';
  const jobs = data || [];

  const ids = jobs.map(j => j.id);
  if (knownJobs !== null && ids.some(id => !knownJobs.includes(id))) alertNewJob();
  knownJobs = ids;

  const box = document.getElementById('jobs');
  if (!jobs.length) { box.innerHTML = '<p class="empty">No jobs yet. Stay online, busy area: Ikorodu.</p>'; return; }
  box.innerHTML = jobs.map(j => `<div class="job">
    <div class="row"><span>${esc(j.vendors ? j.vendors.store_name : 'Vendor')}</span><span style="color:var(--green)">₦${Number(j.delivery_fee).toLocaleString()}</span></div>
    <div class="sub" style="margin-bottom:4px">🏪 Pickup: ${esc(j.vendors ? j.vendors.address : '')}</div>
    <div class="sub" style="margin-bottom:10px">📍 Drop-off: ${esc(j.delivery_address)}</div>
    <button class="btn" onclick="acceptJob('${j.id}')">ACCEPT JOB</button></div>`).join('');
}

function alertNewJob() {
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.3;
    o.start(); o.stop(audioCtx.currentTime + 0.5);
  } catch (e) {}
}

async function acceptJob(id) {
  const { data, error } = await sb.rpc('accept_order', { p_order_id: id });
  if (error) { alert(error.message); return; }
  if (!data.success) { alert(data.message); fetchJobs(); return; }
  switchTab('trip'); refresh();
}

async function fetchTrip() {
  const { data } = await sb.from('orders')
    .select('*, vendors(store_name, address)')
    .eq('rider_id', rider.id).not('status', 'in', '(delivered,cancelled)')
    .order('accepted_at', { ascending: false }).limit(1).maybeSingle();
  renderTrip(data);
}

function renderTrip(job) {
  const box = document.getElementById('trip');
  if (!job) { box.innerHTML = '<p class="empty">No active trip.</p>'; return; }
  const steps = {
    accepted: ['ARRIVED AT VENDOR', 'arrived_at_vendor'],
    arrived_at_vendor: ['ENTER PICKUP CODE & PICK UP', 'picked_up'],
    picked_up: ['ARRIVED AT CUSTOMER', 'arrived_at_customer'],
    arrived_at_customer: ['ENTER DELIVERY CODE & DELIVER', 'delivered']
  };
  const [text, next] = steps[job.status];
  box.innerHTML = `<div class="box-title">Active Order ${esc(job.order_number)}</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(job.vendors ? job.vendors.store_name : 'Vendor')} ➔ ${esc(job.customer_name)}</div>
    <div class="sub" style="margin-bottom:4px">🏪 ${esc(job.vendors ? job.vendors.address : '')}</div>
    <div class="sub" style="margin-bottom:10px">📍 ${esc(job.delivery_address)}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center;background:#3B82F6" href="tel:${esc(job.customer_phone)}">📞 Call customer</a>
      <a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center;background:#3B82F6" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(job.delivery_address)}">🗺️ Map</a>
    </div>
    <button class="btn" onclick="advance('${job.id}','${next}')">${text}</button>`;
}

async function advance(id, next) {
  let code = null;
  if (next === 'picked_up') { code = prompt('Enter the 4-digit pickup code from the vendor:'); if (code === null) return; }
  if (next === 'delivered') { code = prompt('Enter the 4-digit delivery code from the customer:'); if (code === null) return; }
  const { data, error } = await sb.rpc('update_order_status', { p_order_id: id, p_new_status: next, p_verification_code: code });
  if (error) alert(error.message); else if (!data.success) alert(data.message);
  refresh();
}

function switchTab(t) {
  document.getElementById('tab-offers').style.display = t === 'offers' ? 'block' : 'none';
  document.getElementById('tab-trip').style.display = t === 'trip' ? 'block' : 'none';
  document.getElementById('nav-offers').classList.toggle('active', t === 'offers');
  document.getElementById('nav-trip').classList.toggle('active', t === 'trip');
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
