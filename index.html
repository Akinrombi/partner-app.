<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor Dashboard</title>

  <style>
    :root {
      --primary: #00A859;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --danger: #EF4444;
      --warning: #F59E0B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 70px; }
    .app-container { width: 100%; max-width: 480px; }

    /* Store Header */
    .store-header { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .store-title { font-size: 16px; font-weight: 700; }
    .store-subtitle { font-size: 12px; color: var(--text-muted); }
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }
    .status-open { background: rgba(0, 168, 89, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .status-closed { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    /* Top Navigation Tabs */
    .nav-tabs { display: flex; background: var(--card-bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; gap: 4px; }
    .tab-btn { flex: 1; padding: 10px 0; background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 8px; transition: 0.2s; text-align: center; }
    .tab-btn.active { background: var(--primary); color: white; font-weight: 700; }

    /* Tab Content Displays */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--card-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-val { font-size: 18px; font-weight: 800; color: var(--text); margin-top: 4px; }

    /* Standard Cards */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; letter-spacing: 0.5px; }

    /* Form Fields */
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; padding: 12px; background: #0F172A; border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; outline: none; }

    /* Buttons */
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-warning { background-color: var(--warning); color: #000; padding: 8px 12px; font-size: 12px; border-radius: 6px; }
    .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 11px; border-radius: 6px; }

    /* List Items */
    .list-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 15px; display: block; }
    .item-price { color: var(--primary); font-weight: 700; font-size: 14px; margin-top: 2px; }
    .item-cat { font-size: 11px; color: var(--text-muted); background: #0F172A; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }

    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Store Header -->
  <div class="store-header">
    <div>
      <div class="store-title" id="displayStoreName">My Vendor Store</div>
      <div class="store-subtitle">Vendor Control Dashboard</div>
    </div>
    <button id="storeStatusBtn" class="status-badge status-open" onclick="toggleStoreStatus()">STORE OPEN</button>
  </div>

  <!-- Tab Buttons -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('ordersTab', this)">Orders</button>
    <button class="tab-btn" onclick="switchTab('menuTab', this)">Menu Manager</button>
    <button class="tab-btn" onclick="switchTab('settingsTab', this)">Settings</button>
  </div>

  <!-- TAB 1: ORDERS & EARNINGS -->
  <div id="ordersTab" class="tab-content active">
    <div class="stats-grid">
      <div class="stat-card">
        <div style="font-size:11px; color:var(--text-muted); font-weight:600;">TODAY'S SALES</div>
        <div class="stat-val" id="totalEarnings">₦0</div>
      </div>
      <div class="stat-card">
        <div style="font-size:11px; color:var(--text-muted); font-weight:600;">COMPLETED ORDERS</div>
        <div class="stat-val" id="totalOrdersCount">0</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div class="section-title" style="margin:0;">Incoming Customer Orders</div>
        <button onclick="addDemoOrder()" style="background:transparent; color:var(--primary); border:none; font-size:12px; font-weight:bold; cursor:pointer;">+ Test Order</button>
      </div>
      <div id="ordersContainer">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">No active incoming orders.</p>
      </div>
    </div>
  </div>

  <!-- TAB 2: MENU MANAGER -->
  <div id="menuTab" class="tab-content">
    <div class="card">
      <div class="section-title">Add New Dish / Food Item</div>

      <div class="input-group">
        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option value="Main Dishes">Main Dishes (Rice, Swallows)</option>
          <option value="Proteins">Proteins (Chicken, Meat, Fish)</option>
          <option value="Sides & Extras">Sides & Extras (Plantain, Chips)</option>
          <option value="Drinks & Beverages">Drinks & Beverages</option>
        </select>
      </div>
      
      <div class="input-group">
        <label for="itemName">Food / Dish Name</label>
        <input type="text" id="itemName" placeholder="e.g. Jollof Rice & Fried Chicken">
      </div>

      <div class="input-group">
        <label for="itemPrice">Price in Naira (₦)</label>
        <input type="number" id="itemPrice" placeholder="e.g. 2500">
      </div>

      <button class="btn btn-primary" onclick="addMenuItem()">+ ADD TO MENU</button>
    </div>

    <div class="card">
      <div class="section-title">Current Store Menu</div>
      <div id="menuContainer">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">No food items added yet.</p>
      </div>
    </div>
  </div>

  <!-- TAB 3: SETTINGS & STORE HOURS -->
  <div id="settingsTab" class="tab-content">
    <div class="card">
      <div class="section-title">Store Profile & Settings</div>
      
      <div class="input-group">
        <label for="storeNameInput">Store Name</label>
        <input type="text" id="storeNameInput" value="My Vendor Store">
      </div>

      <div class="input-group">
        <label for="storePhoneInput">Store Contact Phone</label>
        <input type="tel" id="storePhoneInput" placeholder="08012345678">
      </div>

      <div class="input-group">
        <label for="prepTimeInput">Average Preparation Time</label>
        <select id="prepTimeInput">
          <option value="15">15 - 20 Minutes</option>
          <option value="30" selected>25 - 30 Minutes</option>
          <option value="45">40 - 45 Minutes</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </div>

</div>

<script>
  let isStoreOpen = true;

  document.addEventListener('DOMContentLoaded', () => {
    loadMenu();
    loadOrders();
    loadSettings();
  });

  // Switch between tabs
  function switchTab(tabId, element) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    element.classList.add('active');
  }

  // Toggle Open/Closed
  function toggleStoreStatus() {
    isStoreOpen = !isStoreOpen;
    const btn = document.getElementById('storeStatusBtn');
    if (isStoreOpen) {
      btn.className = 'status-badge status-open';
      btn.innerText = 'STORE OPEN';
    } else {
      btn.className = 'status-badge status-closed';
      btn.innerText = 'STORE CLOSED';
    }
  }

  // Menu Handling
  function getMenu() {
    return JSON.parse(localStorage.getItem('vendor_store_menu') || '[]');
  }

  function addMenuItem() {
    const category = document.getElementById('itemCategory').value;
    const name = document.getElementById('itemName').value.trim();
    const price = document.getElementById('itemPrice').value.trim();

    if (!name || !price) {
      alert("Please enter both the item name and price.");
      return;
    }

    const currentMenu = getMenu();
    currentMenu.push({ id: Date.now(), category: category, name: name, price: price, inStock: true });
    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));

    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    loadMenu();
  }

  function toggleStock(id) {
    const currentMenu = getMenu();
    const item = currentMenu.find(i => i.id === id);
    if (item) {
      item.inStock = !item.inStock;
      localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
      loadMenu();
    }
  }

  function deleteItem(id) {
    let currentMenu = getMenu();
    currentMenu = currentMenu.filter(item => item.id !== id);
    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
    loadMenu();
  }

  function loadMenu() {
    const menu = getMenu();
    const container = document.getElementById('menuContainer');

    if (menu.length === 0) {
      container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">No food items added yet.</p>`;
      return;
    }

    container.innerHTML = menu.map(item => `
      <div class="list-item" style="display:flex; justify-content:space-between; align-items:center; opacity: ${item.inStock ? '1' : '0.5'};">
        <div>
          <span class="item-cat">${item.category || 'General'}</span>
          <span class="item-name">${item.name} ${!item.inStock ? '<small style="color:var(--danger);">(Sold Out)</small>' : ''}</span>
          <div class="item-price">₦${Number(item.price).toLocaleString()}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <label class="switch">
            <input type="checkbox" ${item.inStock ? 'checked' : ''} onchange="toggleStock(${item.id})">
            <span class="slider"></span>
          </label>
          <button class="btn btn-danger" onclick="deleteItem(${item.id})" style="margin-left:10px;">Delete</button>
        </div>
      </div>
    `).join('');
  }

  // Orders Handling
  function getOrders() {
    return JSON.parse(localStorage.getItem('vendor_active_orders') || '[]');
  }

  function addDemoOrder() {
    const orders = getOrders();
    const demo = {
      id: Date.now(),
      customer: 'Hawa B.',
      address: 'Agric Bus Stop, Ikorodu',
      item: 'Jollof Rice & Fried Chicken',
      amount: 3500,
      status: 'Preparing'
    };
    orders.push(demo);
    localStorage.setItem('vendor_active_orders', JSON.stringify(orders));
    loadOrders();
  }

  function markReady(id) {
    let orders = getOrders();
    const order = orders.find(o => o.id === id);
    if (order) {
      let totalSales = parseFloat(localStorage.getItem('vendor_total_sales') || '0') + order.amount;
      let count = parseInt(localStorage.getItem('vendor_order_count') || '0') + 1;
      localStorage.setItem('vendor_total_sales', totalSales);
      localStorage.setItem('vendor_order_count', count);

      orders = orders.filter(o => o.id !== id);
      localStorage.setItem('vendor_active_orders', JSON.stringify(orders));
      loadOrders();
    }
  }

  function loadOrders() {
    const orders = getOrders();
    const container = document.getElementById('ordersContainer');
    
    document.getElementById('totalEarnings').innerText = '₦' + Number(localStorage.getItem('vendor_total_sales') || '0').toLocaleString();
    document.getElementById('totalOrdersCount').innerText = localStorage.getItem('vendor_order_count') || '0';

    if (orders.length === 0) {
      container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">No active incoming orders.</p>`;
      return;
    }

    container.innerHTML = orders.map(o => `
      <div class="list-item" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span class="item-cat" style="color:var(--warning); background:rgba(245,158,11,0.1);">${o.status}</span>
          <span class="item-name">${o.item}</span>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">📍 ${o.customer} (${o.address})</div>
          <div class="item-price" style="margin-top:2px;">₦${Number(o.amount).toLocaleString()}</div>
        </div>
        <button class="btn btn-warning" onclick="markReady(${o.id})">READY FOR RIDER</button>
      </div>
    `).join('');
  }

  // Settings Handling
  function saveSettings() {
    const name = document.getElementById('storeNameInput').value;
    if (name) {
      localStorage.setItem('vendor_store_name', name);
      document.getElementById('displayStoreName').innerText = name;
      alert("Settings saved successfully!");
    }
  }

  function loadSettings() {
    const savedName = localStorage.getItem('vendor_store_name');
    if (savedName) {
      document.getElementById('displayStoreName').innerText = savedName;
      document.getElementById('storeNameInput').value = savedName;
    }
  }
</script>

</body>
</html>
