<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rider App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #00A859;
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --text-white: #F8FAFC;
      --text-gray: #94A3B8;
      --border: #334155;
      --danger: #EF4444;
      --warning: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-white); padding: 12px; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
    .app-wrapper { width: 100%; max-width: 480px; }

    /* HEADER */
    .header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 12px; color: var(--text-gray); }
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--primary); background: rgba(0, 168, 89, 0.2); color: var(--primary); }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-card { background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .stat-card span { font-size: 10px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; }
    .stat-card b { display: block; font-size: 18px; margin-top: 4px; color: var(--text-white); }

    /* ORDER CARDS */
    .order-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
    .order-id { font-weight: 800; font-size: 15px; }
    .order-status { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--border); color: var(--text-gray); }
    .order-status.pickup { background: rgba(0, 168, 89, 0.2); color: var(--primary); }
    .order-status.deliver { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-gray); }
    .detail-row b { color: var(--text-white); }
    .address-box { background: #0F172A; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 12px; border-left: 3px solid var(--primary); }
    
    /* BUTTONS */
    .action-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; min-height: 48px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-green { background: var(--primary); color: #fff; }
    .btn-blue { background: #3B82F6; color: #fff; }
    .btn-gray { background: var(--border); color: var(--text-white); }

    /* SCANNING MODAL OVERLAY */
    .scan-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .scan-overlay.active { display: flex; }
    .scan-box { position: relative; width: 260px; height: 260px; border-radius: 20px; background: #1E293B; border: 1px solid #334155; overflow: hidden; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
    
    /* The Scanning Laser Animation */
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--primary); box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary); animation: scan 2s linear infinite; }
    @keyframes scan {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Corner Brackets for the scanner */
    .scan-box::before, .scan-box::after { content: ''; position: absolute; width: 30px; height: 30px; border: 3px solid var(--primary); border-radius: 4px; }
    .scan-box::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .scan-box::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    
    .scan-icon { font-size: 60px; opacity: 0.3; }
    .scan-text { font-size: 14px; color: var(--text-gray); margin-bottom: 20px; }
    .pin-input { width: 100%; max-width: 260px; height: 60px; font-size: 32px; letter-spacing: 12px; text-align: center; background: #0F172A; border: 2px solid var(--primary); border-radius: 12px; color: #fff; font-weight: 800; outline: none; margin-bottom: 20px; }
    .close-scan { color: var(--danger); font-weight: 700; font-size: 14px; cursor: pointer; }

    /* UTILS */
    .hidden { display: none !important; }
    .empty-state { text-align: center; color: var(--text-gray); font-size: 13px; padding: 30px 0; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- HEADER -->
  <div class="header">
    <div>
      <h1 id="riderName">Rider Dashboard</h1>
      <p>Active Deliveries</p>
    </div>
    <div class="status-badge" id="onlineToggle" onclick="toggleOnline()">🟢 ONLINE</div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card"><span>Today's Deliveries</span><b id="statDeliveries">0</b></div>
    <div class="stat-card"><span>Today's Earnings</span><b id="statEarnings">₦0</b></div>
  </div>

  <!-- ORDERS LIST -->
  <div id="ordersContainer">
    <div class="empty-state">No active deliveries. You are online and waiting for orders!</div>
  </div>
</div>

<!-- SCANNING MODAL -->
<div id="scanModal" class="scan-overlay">
  <div class="scan-box">
    <div class="scan-line"></div>
    <div class="scan-icon">📷</div>
  </div>
  <div class="scan-text" id="scanText">Scanning for Order QR...</div>
  
  <input type="tel" id="pinInput" class="pin-input" placeholder="----" maxlength="4" inputmode="numeric">
  <button class="btn btn-green" style="width:260px; margin-bottom:20px;" onclick="verifyPin()">VERIFY PIN</button>
  <div class="close-scan" onclick="closeScan()">Cancel</div>
</div>

<script>
  const SUPABASE_URL = "https://glkutdkwbrjpiuqcmgwe.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsa3V0ZGt3YnJqcGl1cWNtZ3dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzU3MTMsImV4cCI6MjEwNTU1MTcxM30.f2SgZJvP681imm0Qe1fKsATnCk_86z2guwvZWASXoZM";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let rider = null;
  let activeOrders = [];
  let pendingVerifyOrderId = null;
  let pendingAction = null; // 'pickup' or 'deliver'

  window.onload = async function() {
    const s = await sb.auth.getSession();
    if (s.data.session) initApp(s.data.session.user);
  };

  async function initApp(user) {
    // Fetch rider profile
    const { data, error } = await sb.from('riders').select('*, profiles(name, phone)').eq('owner_id', user.id).maybeSingle();
    if (error || !data) { alert('No rider account found. Contact admin.'); return; }
    rider = data;
    document.getElementById('riderName').innerText = rider.profiles.name || 'Rider';
    loadOrders();
    setInterval(loadOrders, 15000); // Auto refresh every 15s
  }

  // Mock function to simulate switching online/offline
  function toggleOnline() {
    const el = document.getElementById('onlineToggle');
    if (el.innerText.includes('ONLINE')) {
       el.innerHTML = '🔴 OFFLINE';
       el.style.borderColor = 'var(--danger)';
       el.style.background = 'rgba(239, 68, 68, 0.2)';
       el.style.color = 'var(--danger)';
    } else {
       el.innerHTML = '🟢 ONLINE';
       el.style.borderColor = 'var(--primary)';
       el.style.background = 'rgba(0, 168, 89, 0.2)';
       el.style.color = 'var(--primary)';
    }
  }

  async function loadOrders() {
    if (!rider) return;
    // Fetch orders assigned to this rider that are not yet delivered
    const { data, error } = await sb.from('orders')
      .select('*')
      .eq('rider_id', rider.id)
      .in('status', ['accepted', 'arrived_at_vendor', 'picked_up', 'arrived_at_customer'])
      .order('created_at', { ascending: true });

    if (error) return;
    activeOrders = data || [];
    renderOrders();
    updateStats();
  }

  function renderOrders() {
    const container = document.getElementById('ordersContainer');
    if (activeOrders.length === 0) {
      container.innerHTML = '<div class="empty-state">No active deliveries. You are online and waiting for orders!</div>';
      return;
    }

    container.innerHTML = activeOrders.map(o => {
      let actionBtn = '';
      let statusClass = '';
      let statusText = '';

      if (o.status === 'accepted' || o.status === 'arrived_at_vendor') {
         statusClass = 'pickup';
         statusText = 'Go to Vendor';
         actionBtn = `<button class="btn btn-blue" onclick="openScan('${o.id}', 'pickup')">📷 Verify Pickup</button>`;
      } else if (o.status === 'picked_up' || o.status === 'arrived_at_customer') {
         statusClass = 'deliver';
         statusText = 'Delivering to Customer';
         actionBtn = `<button class="btn btn-green" onclick="openScan('${o.id}', 'deliver')">✅ Verify Delivery</button>`;
      }

      // Google Maps links for vendor and customer
      const vendorMapLink = `https://maps.google.com/?q=${encodeURIComponent(o.vendor_address || '')}`;
      const customerMapLink = o.delivery_address.includes('Lat:') 
         ? `https://maps.google.com/?q=${o.delivery_address.replace('Lat: ', '').replace(', Long: ', ',')}` 
         : `https://maps.google.com/?q=${encodeURIComponent(o.delivery_address)}`;

      return `
      <div class="order-card">
        <div class="order-header">
          <span class="order-id">${o.order_number}</span>
          <span class="order-status ${statusClass}">${statusText}</span>
        </div>
        <div class="detail-row"><span>Customer:</span><b>${o.customer_name}</b></div>
        <div class="detail-row"><span>Items:</span><b>${o.items.length} item(s)</b></div>
        <div class="detail-row"><span>Total:</span><b>₦${Number(o.total).toLocaleString()}</b></div>
        
        <div class="address-box">
          <b>🏪 Pickup:</b><br>${o.vendor_address || 'Restaurant Address'}<br>
          <a href="${vendorMapLink}" target="_blank" style="color:var(--primary); font-size:11px;">Open Map</a>
        </div>
        <div class="address-box">
          <b>📍 Dropoff:</b><br>${o.delivery_address}<br>
          <a href="${customerMapLink}" target="_blank" style="color:var(--primary); font-size:11px;">Open Map</a>
        </div>

        <div class="action-row">
          <a class="btn btn-gray" href="tel:${o.customer_phone}">📞 Call Customer</a>
          ${actionBtn}
        </div>
      </div>`;
    }).join('');
  }

  function updateStats() {
    // Mock stats - in a real app, query a rider_stats RPC
    const deliveredCount = activeOrders.filter(o => o.status === 'delivered').length;
    document.getElementById('statDeliveries').innerText = deliveredCount;
    document.getElementById('statEarnings').innerText = '₦' + (deliveredCount * 500).toLocaleString();
  }

  // ---------- SCANNING LOGIC ----------
  function openScan(orderId, action) {
    pendingVerifyOrderId = orderId;
    pendingAction = action;
    document.getElementById('pinInput').value = '';
    document.getElementById('scanText').innerText = action === 'pickup' 
      ? 'Enter the 4-digit pickup code from the vendor' 
      : 'Enter the 4-digit delivery PIN from the customer';
    document.getElementById('scanModal').classList.add('active');
    document.getElementById('pinInput').focus();
  }

  function closeScan() {
    document.getElementById('scanModal').classList.remove('active');
    pendingVerifyOrderId = null;
    pendingAction = null;
  }

  async function verifyPin() {
    const pin = document.getElementById('pinInput').value.trim();
    if (pin.length !== 4) { alert('Please enter a 4-digit PIN.'); return; }

    const order = activeOrders.find(o => o.id === pendingVerifyOrderId);
    if (!order) { closeScan(); return; }

    let isValid = false;
    let nextStatus = '';

    if (pendingAction === 'pickup') {
       // For pickup, we check the pickup_code generated by the vendor
       if (order.pickup_code && order.pickup_code === pin) {
          isValid = true; nextStatus = 'picked_up';
       }
    } else if (pendingAction === 'deliver') {
       // For delivery, we check the delivery_code given by the customer
       if (order.delivery_code && order.delivery_code === pin) {
          isValid = true; nextStatus = 'delivered';
       }
    }

    if (isValid) {
       // Update order status in Supabase
       const { error } = await sb.from('orders').update({ status: nextStatus }).eq('id', order.id);
       if (error) { alert('Failed to update order: ' + error.message); return; }
       
       // Play success animation/sound
       document.getElementById('scanText').innerHTML = '<span style="color:var(--primary); font-weight:800;">✅ VERIFIED SUCCESSFULLY!</span>';
       setTimeout(() => { closeScan(); loadOrders(); }, 1500);
    } else {
       // Wrong PIN
       document.getElementById('pinInput').style.borderColor = 'var(--danger)';
       document.getElementById('scanText').innerHTML = '<span style="color:var(--danger); font-weight:800;">❌ INVALID PIN. TRY AGAIN.</span>';
       setTimeout(() => {
          document.getElementById('pinInput').style.borderColor = 'var(--primary)';
          document.getElementById('scanText').innerText = 'Enter the 4-digit PIN';
          document.getElementById('pinInput').value = '';
          document.getElementById('pinInput').focus();
       }, 1500);
    }
  }

  // Allow pressing Enter to verify
  document.getElementById('pinInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') verifyPin();
  });
</script>

</body>
</html>
